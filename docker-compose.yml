x-app-common: &app-common
  image: ${APP_IMAGE:-crypto-scanner:latest}
  env_file:
    - .env
  volumes:
    - .:/code
  depends_on:
    - db
    - redis
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-env-common: &env-common
  POSTGRES_NAME: ${POSTGRES_NAME}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-footprint-environment: &footprint-environment
  FOOTPRINT_DATABASE: ${FOOTPRINT_DATABASE:-footprints_rust}
  FOOTPRINT_CLICKHOUSE_URL: ${FOOTPRINT_CLICKHOUSE_URL:-http://clickhouse:8123}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-footprints}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
  FOOTPRINT_DATA_DIR: /var/lib/footprints
  FOOTPRINT_OUTBOX_MAX_BYTES: ${FOOTPRINT_OUTBOX_MAX_BYTES:-2147483648}
  FOOTPRINT_DISK_RESERVE_BYTES: ${FOOTPRINT_DISK_RESERVE_BYTES:-5368709120}
  FOOTPRINT_ALLOWED_ORIGINS: ${FOOTPRINT_ALLOWED_ORIGINS:-https://www.crypto-scanner.xyz,https://crypto-scanner.xyz,http://localhost:5173,http://localhost:3000}

x-footprint-common: &footprint-common
  image: ${FOOTPRINT_IMAGE:-crypto-scanner-footprints:latest}
  build:
    context: .
    dockerfile: Dockerfile.footprints
  environment: *footprint-environment
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 60s
  healthcheck:
    test: ["CMD", "footprints", "health"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 15s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    container_name: cs-db
    image: postgres:18
    restart: unless-stopped
    volumes:
      - pgdata18:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  clickhouse:
    container_name: cs-clickhouse
    image: clickhouse:26.3.17.56
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-footprints}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-footprints}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HOST_PORT:-8123}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    container_name: cs-redis
    image: "redis/redis-stack-server@sha256:a4ec9645bb2ae14e4eb38f724fbd10be2521238700f647089022b905cccad4d8"
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    <<: *app-common
    build:
      context: .
      target: runtime
    container_name: cs-app
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  binance-klines:
    <<: *app-common
    container_name: cs-binance-klines
    command: python manage.py klines --exchange binance
    environment:
      <<: *env-common
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'klines.*binance' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  binance-correlations:
    <<: *app-common
    container_name: cs-binance-correlations
    command: python manage.py incremental_correlations --exchange binance
    depends_on:
      - db
      - redis
      - binance-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f incremental_correlations || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  binance-zscore:
    <<: *app-common
    container_name: cs-binance-zscore
    command: python manage.py incremental_zscore --exchange binance
    environment:
      <<: *env-common
    depends_on:
      - db
      - redis
      - binance-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f incremental_zscore || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  binance-cointegration:
    <<: *app-common
    container_name: cs-binance-cointegration
    command: python manage.py cointegration_scan --exchange binance --window-minutes 1440 --cadence-minutes 15
    environment:
      <<: *env-common
    depends_on:
      - db
      - binance-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'cointegration_scan.*binance' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  hyperliquid-klines:
    <<: *app-common
    container_name: cs-hyperliquid-klines
    command: python manage.py klines --exchange hyperliquid
    environment:
      <<: *env-common
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'klines.*hyperliquid' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  hyperliquid-correlations:
    <<: *app-common
    container_name: cs-hyperliquid-correlations
    command: python manage.py incremental_correlations --exchange hyperliquid
    environment:
      <<: *env-common
    depends_on:
      - db
      - redis
      - hyperliquid-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'incremental_correlations.*hyperliquid' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  hyperliquid-zscore:
    <<: *app-common
    container_name: cs-hyperliquid-zscore
    command: python manage.py incremental_zscore --exchange hyperliquid
    environment:
      <<: *env-common
    depends_on:
      - db
      - redis
      - hyperliquid-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'incremental_zscore.*hyperliquid' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  hyperliquid-cointegration:
    <<: *app-common
    container_name: cs-hyperliquid-cointegration
    command: python manage.py cointegration_scan --exchange hyperliquid --window-minutes 1440 --cadence-minutes 15
    environment:
      <<: *env-common
    depends_on:
      - db
      - hyperliquid-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'cointegration_scan.*hyperliquid' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  bybit-klines:
    <<: *app-common
    container_name: cs-bybit-klines
    command: python manage.py klines --exchange bybit
    environment:
      <<: *env-common
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'klines.*bybit' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  bybit-correlations:
    <<: *app-common
    container_name: cs-bybit-correlations
    command: python manage.py incremental_correlations --exchange bybit
    environment:
      <<: *env-common
    depends_on:
      - db
      - redis
      - bybit-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'incremental_correlations.*bybit' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  bybit-zscore:
    <<: *app-common
    container_name: cs-bybit-zscore
    command: python manage.py incremental_zscore --exchange bybit
    environment:
      <<: *env-common
    depends_on:
      - db
      - redis
      - bybit-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'incremental_zscore.*bybit' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  bybit-cointegration:
    <<: *app-common
    container_name: cs-bybit-cointegration
    command: python manage.py cointegration_scan --exchange bybit --window-minutes 1440 --cadence-minutes 15
    environment:
      <<: *env-common
    depends_on:
      - db
      - bybit-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'cointegration_scan.*bybit' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  okx-klines:
    <<: *app-common
    container_name: cs-okx-klines
    command: python manage.py klines --exchange okx
    environment:
      <<: *env-common
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'klines.*okx' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  okx-correlations:
    <<: *app-common
    container_name: cs-okx-correlations
    command: python manage.py incremental_correlations --exchange okx
    environment:
      <<: *env-common
    depends_on:
      - db
      - redis
      - okx-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'incremental_correlations.*okx' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  okx-zscore:
    <<: *app-common
    container_name: cs-okx-zscore
    command: python manage.py incremental_zscore --exchange okx
    environment:
      <<: *env-common
    depends_on:
      - db
      - redis
      - okx-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'incremental_zscore.*okx' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  okx-cointegration:
    <<: *app-common
    container_name: cs-okx-cointegration
    command: python manage.py cointegration_scan --exchange okx --window-minutes 1440 --cadence-minutes 15
    environment:
      <<: *env-common
    depends_on:
      - db
      - okx-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'cointegration_scan.*okx' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  db-maintenance:
    <<: *app-common
    container_name: cs-db-maintenance
    command: python manage.py db_maintenance
    environment:
      <<: *env-common
      KLINE_CLEANUP_ENABLED: ${KLINE_CLEANUP_ENABLED:-true}
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f db_maintenance || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  footprint-api:
    <<: *footprint-common
    container_name: cs-footprint-api
    command: ["serve"]
    volumes:
      - footprint_rust_control:/var/lib/footprints

  binance-footprints:
    <<: *footprint-common
    image: ${BINANCE_FOOTPRINT_IMAGE:-${FOOTPRINT_IMAGE:-crypto-scanner-footprints:latest}}
    container_name: cs-binance-footprints
    command: ["collect", "--exchange", "binance"]
    volumes:
      - binance_footprint_rust:/var/lib/footprints

  bybit-footprints:
    <<: *footprint-common
    image: ${BYBIT_FOOTPRINT_IMAGE:-${FOOTPRINT_IMAGE:-crypto-scanner-footprints:latest}}
    container_name: cs-bybit-footprints
    command: ["collect", "--exchange", "bybit"]
    volumes:
      - bybit_footprint_rust:/var/lib/footprints

  hyperliquid-footprints:
    <<: *footprint-common
    image: ${HYPERLIQUID_FOOTPRINT_IMAGE:-${FOOTPRINT_IMAGE:-crypto-scanner-footprints:latest}}
    container_name: cs-hyperliquid-footprints
    command: ["collect", "--exchange", "hyperliquid"]
    volumes:
      - hyperliquid_footprint_rust:/var/lib/footprints

  gateway:
    image: nginx:1.28-alpine
    container_name: cs-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"
    volumes:
      - ./deploy/footprint-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - footprint-api

volumes:
  footprint_rust_control:
  binance_footprint_rust:
  bybit_footprint_rust:
  hyperliquid_footprint_rust:
  # Legacy volumes are never mounted by Rust; remove manually after release verification.
  binance_footprint_outbox:
  bybit_footprint_outbox:
  pgdata18:
  clickhouse_data:
