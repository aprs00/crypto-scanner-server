version: '3.8'

x-app-common: &app-common
  image: ${APP_IMAGE:-crypto-scanner:latest}
  env_file:
    - .env
  volumes:
    - .:/code
  depends_on:
    - db
    - redis
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-env-common: &env-common
  POSTGRES_NAME: ${POSTGRES_NAME}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-footprint-environment: &footprint-environment
  <<: *env-common
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-footprints}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-footprints}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
  CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
  CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
  CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-false}
  FOOTPRINT_STATE_DIR: /tmp/footprint-state

x-chart-common: &chart-common
  <<: *app-common
  environment:
    <<: *footprint-environment

services:
  db:
    container_name: cs-db
    image: postgres:18
    restart: unless-stopped
    volumes:
      - pgdata18:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  clickhouse:
    container_name: cs-clickhouse
    image: clickhouse:26.3.17.56
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-footprints}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-footprints}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HOST_PORT:-8123}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    container_name: cs-redis
    image: "redis/redis-stack-server@sha256:a4ec9645bb2ae14e4eb38f724fbd10be2521238700f647089022b905cccad4d8"
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    <<: *chart-common
    build:
      context: .
      target: runtime
    container_name: cs-app
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"

  binance-klines:
    <<: *app-common
    container_name: cs-binance-klines
    command: python manage.py klines --exchange binance
    environment:
      <<: *env-common
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'klines.*binance' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  binance-footprints:
    <<: *chart-common
    image: ${BINANCE_FOOTPRINT_IMAGE:-${APP_IMAGE:-crypto-scanner:latest}}
    environment:
      <<: *footprint-environment
      FOOTPRINT_OUTBOX_DIR: /var/lib/footprints
      FOOTPRINT_OUTBOX_MAX_BYTES: ${FOOTPRINT_OUTBOX_MAX_BYTES:-2147483648}
      FOOTPRINT_DISK_RESERVE_BYTES: ${FOOTPRINT_DISK_RESERVE_BYTES:-5368709120}
    volumes:
      - .:/code
      - binance_footprint_outbox:/var/lib/footprints
    container_name: cs-binance-footprints
    command: python manage.py footprint_trades --exchange binance
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "manage.py", "footprint_health", "--exchange", "binance", "--capture-only"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  binance-correlations:
    <<: *app-common
    container_name: cs-binance-correlations
    command: python manage.py incremental_correlations --exchange binance
    depends_on:
      - db
      - redis
      - binance-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f incremental_correlations || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  binance-zscore:
    <<: *app-common
    container_name: cs-binance-zscore
    command: python manage.py incremental_zscore --exchange binance
    environment:
      <<: *env-common
    depends_on:
      - db
      - redis
      - binance-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f incremental_zscore || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  binance-cointegration:
    <<: *app-common
    container_name: cs-binance-cointegration
    command: python manage.py cointegration_scan --exchange binance --window-minutes 1440 --cadence-minutes 15
    environment:
      <<: *env-common
    depends_on:
      - db
      - binance-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'cointegration_scan.*binance' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  hyperliquid-klines:
    <<: *app-common
    container_name: cs-hyperliquid-klines
    command: python manage.py klines --exchange hyperliquid
    environment:
      <<: *env-common
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'klines.*hyperliquid' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  hyperliquid-footprints:
    <<: *chart-common
    container_name: cs-hyperliquid-footprints
    command: python manage.py footprint_trades --exchange hyperliquid
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[f]ootprint_trades --exchange hyperliquid' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  hyperliquid-correlations:
    <<: *app-common
    container_name: cs-hyperliquid-correlations
    command: python manage.py incremental_correlations --exchange hyperliquid
    environment:
      <<: *env-common
    depends_on:
      - db
      - redis
      - hyperliquid-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'incremental_correlations.*hyperliquid' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  hyperliquid-zscore:
    <<: *app-common
    container_name: cs-hyperliquid-zscore
    command: python manage.py incremental_zscore --exchange hyperliquid
    environment:
      <<: *env-common
    depends_on:
      - db
      - redis
      - hyperliquid-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'incremental_zscore.*hyperliquid' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  hyperliquid-cointegration:
    <<: *app-common
    container_name: cs-hyperliquid-cointegration
    command: python manage.py cointegration_scan --exchange hyperliquid --window-minutes 1440 --cadence-minutes 15
    environment:
      <<: *env-common
    depends_on:
      - db
      - hyperliquid-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'cointegration_scan.*hyperliquid' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  bybit-klines:
    <<: *app-common
    container_name: cs-bybit-klines
    command: python manage.py klines --exchange bybit
    environment:
      <<: *env-common
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'klines.*bybit' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  bybit-footprints:
    <<: *chart-common
    image: ${BYBIT_FOOTPRINT_IMAGE:-${APP_IMAGE:-crypto-scanner:latest}}
    environment:
      <<: *footprint-environment
      FOOTPRINT_OUTBOX_DIR: /var/lib/footprints
      FOOTPRINT_OUTBOX_MAX_BYTES: ${FOOTPRINT_OUTBOX_MAX_BYTES:-2147483648}
      FOOTPRINT_DISK_RESERVE_BYTES: ${FOOTPRINT_DISK_RESERVE_BYTES:-5368709120}
    volumes:
      - .:/code
      - bybit_footprint_outbox:/var/lib/footprints
    container_name: cs-bybit-footprints
    command: python manage.py footprint_trades --exchange bybit
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "manage.py", "footprint_health", "--exchange", "bybit", "--capture-only"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  footprint-maintenance:
    <<: *chart-common
    container_name: cs-footprint-maintenance
    command: python manage.py footprint_maintenance
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[f]ootprint_maintenance' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  bybit-correlations:
    <<: *app-common
    container_name: cs-bybit-correlations
    command: python manage.py incremental_correlations --exchange bybit
    environment:
      <<: *env-common
    depends_on:
      - db
      - redis
      - bybit-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'incremental_correlations.*bybit' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  bybit-zscore:
    <<: *app-common
    container_name: cs-bybit-zscore
    command: python manage.py incremental_zscore --exchange bybit
    environment:
      <<: *env-common
    depends_on:
      - db
      - redis
      - bybit-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'incremental_zscore.*bybit' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  bybit-cointegration:
    <<: *app-common
    container_name: cs-bybit-cointegration
    command: python manage.py cointegration_scan --exchange bybit --window-minutes 1440 --cadence-minutes 15
    environment:
      <<: *env-common
    depends_on:
      - db
      - bybit-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'cointegration_scan.*bybit' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  okx-klines:
    <<: *app-common
    container_name: cs-okx-klines
    command: python manage.py klines --exchange okx
    environment:
      <<: *env-common
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'klines.*okx' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  okx-correlations:
    <<: *app-common
    container_name: cs-okx-correlations
    command: python manage.py incremental_correlations --exchange okx
    environment:
      <<: *env-common
    depends_on:
      - db
      - redis
      - okx-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'incremental_correlations.*okx' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  okx-zscore:
    <<: *app-common
    container_name: cs-okx-zscore
    command: python manage.py incremental_zscore --exchange okx
    environment:
      <<: *env-common
    depends_on:
      - db
      - redis
      - okx-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'incremental_zscore.*okx' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  okx-cointegration:
    <<: *app-common
    container_name: cs-okx-cointegration
    command: python manage.py cointegration_scan --exchange okx --window-minutes 1440 --cadence-minutes 15
    environment:
      <<: *env-common
    depends_on:
      - db
      - okx-klines
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'cointegration_scan.*okx' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  footprint-recovery:
    <<: *chart-common
    container_name: cs-footprint-recovery
    command: python manage.py footprint_reconcile --exchange both --loop
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    stop_grace_period: 60s
    # Start in audit mode. --repair is an explicit operator decision.

  db-maintenance:
    <<: *app-common
    container_name: cs-db-maintenance
    command: python manage.py db_maintenance
    environment:
      <<: *env-common
      KLINE_CLEANUP_ENABLED: ${KLINE_CLEANUP_ENABLED:-true}
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f db_maintenance || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  binance_footprint_outbox:
  bybit_footprint_outbox:
  pgdata18:
  clickhouse_data:
